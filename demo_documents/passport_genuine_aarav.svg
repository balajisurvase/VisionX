<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="guilloche" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#334155" stroke-width="0.5" stroke-dasharray="2 2"/>
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect x="20" y="20" width="760" height="480" rx="20" fill="url(#bg)" stroke="#475569" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="480" rx="20" fill="url(#guilloche)" opacity="0.6"/>

  <!-- Watermark -->
  <text x="400" y="260" text-anchor="middle" font-size="34" font-weight="900" fill="#dc2626" opacity="0.22" transform="rotate(-20 400 260)" letter-spacing="4">
    DEMO • SPECIMEN • NOT A REAL ID
  </text>

  <!-- Header Section -->
  <rect x="20" y="20" width="760" height="70" rx="20" fill="#1e3a8a"/>
  <text x="50" y="62" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2">PASSPORT / PASSEPORT</text>
  <text x="500" y="60" font-size="14" font-weight="700" fill="#93c5fd" letter-spacing="1">REPUBLIC OF INDIA / RÉPUBLIQUE D'INDE</text>

  <!-- Photo Box -->
  <rect x="50" y="110" width="160" height="210" rx="10" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <!-- Synthetic Avatar -->
  <circle cx="130" cy="180" r="45" fill="#cbd5e1"/>
  <path d="M 80 290 Q 130 230 180 290 Z" fill="#94a3b8"/>
  <text x="130" y="310" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">AARAV SHARMA (DEMO)</text>

  <!-- Fields Grid -->
  <!-- Type / Code / Passport No -->
  <text x="240" y="125" font-size="10" font-weight="700" fill="#94a3b8">TYPE / TYPE</text>
  <text x="240" y="142" font-size="14" font-weight="800" fill="#ffffff">P</text>

  <text x="340" y="125" font-size="10" font-weight="700" fill="#94a3b8">COUNTRY CODE</text>
  <text x="340" y="142" font-size="14" font-weight="800" fill="#ffffff">IND</text>

  <text x="480" y="125" font-size="10" font-weight="700" fill="#94a3b8">PASSPORT NO. / NO. DU PASSEPORT</text>
  <text x="480" y="144" font-size="16" font-weight="900" fill="#38bdf8" font-family="monospace">TESTP00123</text>

  <!-- Full Name -->
  <text x="240" y="175" font-size="10" font-weight="700" fill="#94a3b8">NAME / NOM</text>
  <text x="240" y="195" font-size="16" font-weight="800" fill="#ffffff">AARAV SHARMA</text>

  <!-- Nationality -->
  <text x="240" y="225" font-size="10" font-weight="700" fill="#94a3b8">NATIONALITY / NATIONALITÉ</text>
  <text x="240" y="245" font-size="14" font-weight="700" fill="#ffffff">INDIAN</text>

  <!-- Gender & DOB -->
  <text x="400" y="225" font-size="10" font-weight="700" fill="#94a3b8">SEX / SEXE</text>
  <text x="400" y="245" font-size="14" font-weight="700" fill="#ffffff">M</text>

  <text x="480" y="225" font-size="10" font-weight="700" fill="#94a3b8">DATE OF BIRTH / DATE DE NAISSANCE</text>
  <text x="480" y="245" font-size="14" font-weight="700" fill="#ffffff" font-family="monospace">15-04-1998</text>

  <!-- Expiry & Issue -->
  <text x="240" y="275" font-size="10" font-weight="700" fill="#94a3b8">DATE OF ISSUE</text>
  <text x="240" y="295" font-size="14" font-weight="700" fill="#ffffff" font-family="monospace">15-04-2018</text>

  <text x="480" y="275" font-size="10" font-weight="700" fill="#94a3b8">DATE OF EXPIRY / DATE D'EXPIRATION</text>
  <text x="480" y="295" font-size="15" font-weight="800" fill="#4ade80" font-family="monospace">14-04-2028 (VALID)</text>

  <!-- MRZ Zone (ICAO 9303 TD3 standard 2x44 chars) -->
  <rect x="40" y="370" width="720" height="110" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
  <text x="60" y="415" font-size="17" font-weight="700" fill="#e2e8f0" font-family="'OCR-B', 'Courier New', monospace" letter-spacing="4">
    P&lt;INDSHARMA&lt;&lt;AARAV&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;
  </text>
  <text x="60" y="455" font-size="17" font-weight="700" fill="#e2e8f0" font-family="'OCR-B', 'Courier New', monospace" letter-spacing="4">
    TESTP00123IND9804154M2804148&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;02
  </text>
</svg>
